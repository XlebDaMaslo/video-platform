worker_processes auto;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # Конвертация RTMP → HLS
            hls on;
            hls_path /tmp/hls;
            hls_fragment 2s;
            hls_playlist_length 10s;
            hls_cleanup on;

            # Авторизация стримера через Django
            on_publish http://backend:8000/api/streams/auth/;
            on_publish_done http://backend:8000/api/streams/done/;
        }
    }
}

http {
    server {
        listen 80;

        # Отдаём HLS-сегменты
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t              ts;
            }
            alias /tmp/hls;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Headers *;
        }

        # Простая страница статуса
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }
    }
}
